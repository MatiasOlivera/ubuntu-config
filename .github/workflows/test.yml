name: test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  TEST_IMAGE: ghcr.io/matiasolivera/ubuntu-config-test:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck (so the gate never skips)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Run Python unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/python -v
      - run: ./tests/test.sh

  docker-isolated:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # PRs use the published image so apt mirrors stay off the critical path.
      # Changes to the image definition are built locally so they can never be
      # validated against a stale image.
      - name: Choose image mode
        id: mode
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mode="$(bash tests/ci-image-mode.sh "$BASE_REF")"
          [[ $mode == build || $mode == pull ]] || { echo "invalid mode: $mode" >&2; exit 1; }
          # The image is published only after this workflow reaches develop, so
          # a first run (or a registry outage) must not fail the gate.
          if [[ $mode == pull ]] && ! docker pull "$TEST_IMAGE"; then
            printf 'warning: published image unavailable; building locally\n' >&2
            mode=build
          fi
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - name: Run suite in published image
        if: steps.mode.outputs.value == 'pull'
        run: |
          docker pull "$TEST_IMAGE"
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges -v "$PWD:/work:ro" "$TEST_IMAGE" ./tests/test.sh
      - name: Run suite in locally built image
        if: steps.mode.outputs.value == 'build'
        run: docker compose -f tests/compose.yml run --rm test
