name: test-image

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [develop]
    paths:
      - tests/Dockerfile
      - tests/compose.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/matiasolivera/ubuntu-config-test:latest

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image-definition changes and manual runs benefit from layer reuse.
      - name: Build and push (cached)
        if: github.event_name != 'schedule'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          # The gate imports this image as a build cache; see ADR 0017.
          cache-to: |
            type=gha,mode=max
            type=inline

      # Nightly must really hit apt mirrors, or a broken repository or a
      # changed upstream package would be masked by a warm layer cache.
      - name: Build and push (no cache)
        if: github.event_name == 'schedule'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          no-cache: true
          cache-to: type=inline

      - name: Validate the published image
        run: docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges -v "$PWD:/work:ro" "$IMAGE" bash -c './tests/test.sh && bash tests/docker/chezmoi-ignore-check.sh'
