receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  filelog/spans:
    include:
      - /records/**/spans.jsonl
    start_at: beginning
    operators:
      - type: json_parser
  filelog/logs:
    include:
      - /records/**/logs/*.log
    start_at: beginning

processors:
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    labels:
      resource:
        service.name: service.name
      record:
        log.file.name: log.file.name
        run_id: run_id
        app: app
        span_id: span_id
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp, filelog/spans, filelog/logs]
      processors: [batch]
      exporters: [loki]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
