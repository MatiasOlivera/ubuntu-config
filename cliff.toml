# git-cliff configuration for version bumps and the exhaustive changelog.
# Release notes on the release page are generated by GitHub from
# .github/release.yml at the target ref, not from this file (ADR 0016).

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file. The format is
based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and this
project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
This file is generated by git-cliff from Conventional Commits — never
hand-edit it; regenerate it with `sh scripts/release.sh prepare`.\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group }}

{% for commit in entry.commits %}
- {{ commit.message | split(pat="\n") | first | trim }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/MatiasOlivera/ubuntu-workstation/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9].*"
commit_preprocessors = [
  { pattern = '#([0-9]+)', replace = "[#${1}](https://github.com/MatiasOlivera/ubuntu-workstation/issues/${1})" },
]
commit_parsers = [
  { field = "breaking", pattern = "true", group = "Breaking changes" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^revert", group = "Removed" },
  { message = "^(docs|chore|ci|test|style|build|refactor)", skip = true },
]
protect_breaking_commits = true
filter_commits = false
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
